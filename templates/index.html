<!DOCTYPE html>
<html>
<head>
    <title>Family Eligibility Form</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        .box {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Family Eligibility Check</h2>

    <form method="POST">
        <h4>Member 1</h4>
        <input type="text" name="name" placeholder="Name">
        <input type="number" name="income" placeholder="Income">

        <h4>Member 2</h4>
        <input type="text" name="name" placeholder="Name">
        <input type="number" name="income" placeholder="Income">

        <h4>Member 3</h4>
        <input type="text" name="name" placeholder="Name">
        <input type="number" name="income" placeholder="Income">

        <input type="number" name="area" placeholder="Total House Area">

        <br><br>
        <button type="submit">Check</button>
    </form>

    <h3>{{ result }}</h3>
</div>

</body>
</html>
